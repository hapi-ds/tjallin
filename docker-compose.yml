services:
  tj-core:
    build:
      context: .
      dockerfile: services/tj-core/Dockerfile
    volumes:
      - ${TJ_PROJECT_PATH:-./project}:/app/project
      - report-data:/app/reports
      - timesheet-data:/app/timesheets:ro
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tj3", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tj-net

  tj-web:
    build:
      context: .
      dockerfile: services/tj-web/Dockerfile
    ports:
      - "${TJ_WEB_PORT:-8080}:8080"
    volumes:
      - ${TJ_PROJECT_PATH:-./project}:/app/project
      - report-data:/app/reports
    environment:
      - TJ_CHAT_LM_STUDIO_URL=${TJ_CHAT_LM_STUDIO_URL:-http://host.docker.internal:1234/v1}
      - TJ_CHAT_TJ_DOCS_PATH=${TJ_CHAT_TJ_DOCS_PATH:-/app/tj-docs}
    env_file:
      - path: .env
        required: false
    depends_on:
      tj-core:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tj-net

  tj-mail:
    build:
      context: .
      dockerfile: services/tj-mail/Dockerfile
    ports:
      - "127.0.0.1:${TJ_IMAP_PORT:-1143}:143"
    volumes:
      - timesheet-data:/app/timesheets
      - mail-spool:/var/spool/postfix
      - maildir-data:/var/mail
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "postfix", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tj-net

  tj-cron:
    build:
      context: .
      dockerfile: services/tj-cron/Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - path: .env
        required: false
    depends_on:
      tj-mail:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "supercronic"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tj-net

volumes:
  project-data:
  report-data:
  timesheet-data:
  mail-spool:
  maildir-data:

networks:
  tj-net:
    driver: bridge
