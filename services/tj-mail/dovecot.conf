# Dovecot IMAP configuration for tjallin mail service
# Minimal setup for internal Docker network access

# Only enable IMAP (no POP3)
protocols = imap

# Listen on all interfaces, port 143
listen = *

# Disable SSL — internal Docker network only; TLS termination is external
ssl = no
disable_plaintext_auth = no

# Mail storage location (Maildir format)
mail_location = maildir:/var/mail/%u/Maildir

# Authentication configuration
passdb {
  driver = passwd-file
  args = /etc/dovecot/users
}

userdb {
  driver = passwd-file
  args = /etc/dovecot/users
}

# Service configuration for IMAP
service imap-login {
  inet_listener imap {
    port = 143
  }
}
