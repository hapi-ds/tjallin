[project]
name = "tjallin"
version = "0.1.0"
description = "TaskJuggler Docker Compose system - shared utilities and tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "nicegui>=3.12.1",
    "openai>=2.38.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tzdata>=2026.2",
]

[project.scripts]
tj-web = "tj_chat.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tj_utils", "src/tj_chat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: Docker-based integration tests requiring a running stack",
]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "hypothesis>=6.152.9",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.14",
]
